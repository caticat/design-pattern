name: 检查与发布

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 校验代码与站点
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Playground 版本取决于各代码包的最后一次提交。
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false # 只用标准库，没有 go.sum。
      - name: 检查 Go 示例
        run: |
          unformatted=$(gofmt -l codes)
          if [ -n "$unformatted" ]; then
            printf '以下文件需要 gofmt：\n%s\n' "$unformatted"
            exit 1
          fi
          go vet ./...
          go test -count=1 ./...
          go test -race -count=1 ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: 构建站点并校验 Playground 链接
        run: |
          python -m pip install -r requirements.txt
          mkdocs build --strict
          python -I scripts/playground.py
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
        with:
          path: site

  deploy:
    name: 发布到 GitHub Pages
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
