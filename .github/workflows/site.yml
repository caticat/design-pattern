name: 检查与发布

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 校验代码与站点
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Playground 版本取决于各代码包的最后一次提交。
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false # 只用标准库，没有 go.sum。
      - name: 检查 Go 示例
        run: |
          unformatted=$(gofmt -l codes)
          if [ -n "$unformatted" ]; then
            printf '以下文件需要 gofmt：\n%s\n' "$unformatted"
            exit 1
          fi
          go vet ./...
          go test -count=1 ./...
          go test -race -count=1 ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: 构建站点并校验 Playground 链接
        run: |
          python -m pip install -r requirements.txt
          mkdocs build --strict
          python -I scripts/playground.py
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
        with:
          path: site

  check-container:
    name: 校验容器
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建并检查容器
        run: |
          docker build -t design-pattern:check .
          id=$(docker run -d --rm -p 127.0.0.1:8080:8080 design-pattern:check)
          trap 'status=$?; if [ "$status" -ne 0 ]; then docker logs "$id"; fi; docker stop "$id" >/dev/null' EXIT
          base=http://127.0.0.1:8080
          url=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 1 --max-time 5 -o /dev/null -w '%{url_effective}' "$base/")
          test "$url" = "$base/design-pattern/"
          curl -fsS "$base/design-pattern/behavioral/interpreter/" -o /dev/null
          curl -fsS "$base/design-pattern/assets/images/mascot.webp" -o /dev/null
          curl -fsS "$base/design-pattern/stylesheets/extra.css" -o /dev/null
          curl -fsS "$base/design-pattern/search/search_index.json" -o /dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$base/design-pattern/not-found/")" = 404

  publish-container:
    name: 发布容器到 GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [check, check-container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-container
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/caticat/design-pattern:latest
            ghcr.io/caticat/design-pattern:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: 发布到 GitHub Pages
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
