server {
    listen 8080;
    listen [::]:8080;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location = / {
        return 302 /design-pattern/;
    }

    location = /design-pattern {
        return 302 /design-pattern/;
    }

    location /design-pattern/ {
        try_files $uri $uri/ =404;
    }

    location / {
        return 404;
    }

    error_page 404 /design-pattern/404.html;
    location = /design-pattern/404.html {
        internal;
    }
}
