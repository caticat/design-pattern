site_name: Go 设计模式图解
site_description: 用 Go 深入浅出讲解 23 个经典设计模式，配插图、结构图与可运行代码
site_url: https://caticat.github.io/design-pattern/
repo_url: https://github.com/caticat/design-pattern
repo_name: caticat/design-pattern
edit_uri: edit/master/docs/
docs_dir: docs

theme:
  name: material
  language: zh
  logo: assets/images/mascot.webp
  favicon: assets/images/favicon.png
  font: false            # 不加载 Google Fonts（国内访问慢），字体在 extra.css 中用系统字体栈
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
    - toc.follow
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

hooks:
  - hooks/captions.py    # 图注自动编号「图 N-k」

# 篇 = 模式分类；章 = 一个模式（章首页 + 若干节）；节标题写在各页 H1 中
nav:
  - 首页: index.md
  - 创建型模式:
      - creational/index.md
      - 第 1 章 &nbsp; 单例模式:
          - creational/singleton/index.md
          - creational/singleton/problem.md
          - creational/singleton/implementation.md
          - creational/singleton/tradeoffs.md
          - creational/singleton/summary.md
      - 第 2 章 &nbsp; 工厂方法模式:
          - creational/factory-method/index.md
          - creational/factory-method/problem.md
          - creational/factory-method/implementation.md
          - creational/factory-method/registry.md
          - creational/factory-method/summary.md
  - 结构型模式:
      - structural/index.md
      - 第 6 章 &nbsp; 适配器模式:
          - structural/adapter/index.md
          - structural/adapter/problem.md
          - structural/adapter/implementation.md
          - structural/adapter/stdlib.md
          - structural/adapter/summary.md
      - 第 7 章 &nbsp; 装饰器模式:
          - structural/decorator/index.md
          - structural/decorator/problem.md
          - structural/decorator/implementation.md
          - structural/decorator/middleware.md
          - structural/decorator/summary.md
  - 行为型模式:
      - behavioral/index.md
      - 第 13 章 &nbsp; 策略模式:
          - behavioral/strategy/index.md
          - behavioral/strategy/problem.md
          - behavioral/strategy/implementation.md
          - behavioral/strategy/functions.md
          - behavioral/strategy/summary.md
  - 附录:
      - appendix/concurrency.md
